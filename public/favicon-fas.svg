<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="geometricPrecision">
  <!-- Solid Dark Background Plate -->
  <rect width="64" height="64" rx="14" fill="#0A0A0E" stroke="#22222B" stroke-width="2" />

  <!-- Clearly Readable Geometric 'F' with Solid Color Layers -->
  <g transform="translate(13, 11)">
    <!-- Main Vertical Stem (Solid Deep Sunset Orange) -->
    <rect x="0" y="0" width="10" height="42" rx="2" fill="#FF3D00" />

    <!-- Top Horizontal Bar (Solid Vibrant Orange) -->
    <path d="M 10 0 L 36 0 C 37.1 0 38 0.9 38 2 L 38 8 C 38 9.1 37.1 10 36 10 L 10 10 Z" fill="#FF6D00" />

    <!-- Middle Horizontal Bar (Solid Warm Amber Orange) -->
    <path d="M 10 16 L 28 16 C 29.1 16 30 16.9 30 18 L 30 24 C 30 25.1 29.1 26 28 26 L 10 26 Z" fill="#FFA000" />

    <!-- Top Right Corner Accent (Solid Yellow Gold) -->
    <polygon points="38,0 38,10 28,10" fill="#FFC107" />
  </g>
</svg>
